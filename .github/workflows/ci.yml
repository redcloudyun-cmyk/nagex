name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub-hosted runners are ephemeral — nothing installed by a
      # previous run persists — so the Chromium binary AND its OS-level
      # dependencies must be provisioned on every run. This is CI-only:
      # scripts/nagex-update.sh deliberately never runs --with-deps on a
      # persistent host (see docs/DEPLOYMENT.md).
      - run: npx playwright install --with-deps chromium

      - run: npm run build
      - run: npm test
