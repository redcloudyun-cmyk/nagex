name: D09 PR16 Final SHA Cert
on:
  push:
    branches:
      - release/d09-pr16-p0-integrated-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d09-pr16-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-cert:
    name: final-cert (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 75
    env:
      CI: "true"
      NAGEX_TEST_CONCURRENCY: "2"
    steps:
      - name: Checkout EXACT PR SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Linux browser libraries
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Prepare writable production-root sentinel (ephemeral Linux runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /var/lib/nagex || { echo 'Unexpected runner data root; aborting'; exit 1; }
          sudo install -d -m 0777 /var/lib/nagex
          sudo chown "$(id -u):$(id -g)" /var/lib/nagex
          printf '%s\n' '{"sentinel":"must-not-change","updatedAt":"2026-01-01T00:00:00.000Z"}' > /var/lib/nagex/preexisting-record.json
          python3 - <<'PY'
          import hashlib, os, pathlib, json
          root=pathlib.Path('/var/lib/nagex')
          def snapshot():
              return {str(p.relative_to(root)): {
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                  "size":p.stat().st_size,
                  "mtime_ns":p.stat().st_mtime_ns
              } for p in root.rglob('*') if p.is_file()}
          pathlib.Path(os.environ['RUNNER_TEMP'],'nagex-sentinel-before.json').write_text(json.dumps(snapshot(),sort_keys=True))
          PY
      - name: Build
        run: npm run build
      - name: Regression (isolated stores)
        run: npm test
      - name: Browser cert (isolated stores)
        run: npm run test:browser-cert
      - name: Verify writable production sentinel unchanged (always)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          root=pathlib.Path('/var/lib/nagex')
          before=pathlib.Path(os.environ['RUNNER_TEMP'],'nagex-sentinel-before.json')
          if not before.is_file():
              sys.exit('FAIL: production-root sentinel baseline missing')
          old=json.loads(before.read_text())
          now={str(p.relative_to(root)): {
              "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
              "size":p.stat().st_size,
              "mtime_ns":p.stat().st_mtime_ns
          } for p in root.rglob('*') if p.is_file()}
          if old!=now:
              print('FAIL: ephemeral production-root sentinel changed; added:',len(set(now)-set(old)),'removed:',len(set(old)-set(now)),'modified:',len({k for k in old.keys()&now.keys() if old[k]!=now[k]}))
              sys.exit(1)
          print('PASS: Linux writable /var/lib/nagex unchanged including content, size and mtime')
          PY
      - name: Report tested commit
        shell: bash
        run: |
          echo "TESTED_SHA=${GITHUB_SHA}"
          echo "RUNNER_OS=${RUNNER_OS}"
