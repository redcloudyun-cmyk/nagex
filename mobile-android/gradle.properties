# sun.jnu.encoding governs how the JVM decodes native OS strings — file
# paths and command-line/argfile content — and normally defaults to the
# Windows ANSI codepage (CP949 on Korean Windows), not UTF-8. This
# repository's absolute path contains non-ASCII (Korean) characters, and
# without this override, Gradle's own test-worker argument file (used to
# pass a long classpath without hitting Windows' command-line length
# limit) gets written/read with a mismatched encoding, mangling the path
# and causing every unit test class — including ones with no logic
# problem whatsoever — to fail with ClassNotFoundException at
# initialization. Confirmed by running the exact same compiled test
# classes directly via `java -cp` outside Gradle: all pass.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# The repository's absolute path contains non-ASCII (Korean) characters
# (the project directory name is a fixed, external constraint, not
# something this Android module controls). AGP refuses to build under a
# non-ASCII path by default (see http://b.android.com/95744) purely as a
# precaution against certain legacy native toolchains mishandling non-ASCII
# paths; this project uses no NDK/native code, so the underlying risk does
# not apply here.
android.overridePathCheck=true
